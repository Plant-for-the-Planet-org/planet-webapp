name: 'Unit tests'
on:
  pull_request:
jobs:
  vitest:
    name: 'Vitest on Ubuntu'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout the repository'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: 'Install Node Modules'
        run: npm ci

      - name: 'Run tests'
        run: npm run test
