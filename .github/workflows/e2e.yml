name: 'E2E tests'
# Runs when Vercel reports a finished deployment, so the tests hit the preview Vercel already built instead of building the app again here.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  playwright:
    name: 'Playwright on Ubuntu'
    # Only Vercel PR previews are tested. Vercel also reports `Production`, and Heroku deploys report `planet-app-sf` and `planet-app-sf-prod`.
    # Keep the deployment state out of this `if`. GitHub counts a job skipped by `if` as passed, so a failed preview would pass the check.
    if: github.event.deployment.environment == 'Preview' && github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 'Fail when the Vercel preview failed'
        if: github.event.deployment_status.state != 'success'
        env:
          STATE: ${{ github.event.deployment_status.state }}
        run: |
          echo "::error::Vercel reported '$STATE', so there is no preview to test."
          exit 1

      - name: 'Checkout the repository'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: 'Install Node Modules'
        run: npm ci
        env:
          # This job never runs Cypress, so skip downloading its app. Remove this line together with Cypress.
          CYPRESS_INSTALL_BINARY: 0

      - name: 'Install Playwright Chromium'
        run: npx playwright install --with-deps chromium

      - name: 'Run E2E tests'
        id: tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}

      - name: 'Upload the Playwright report'
        # Only when the tests ran. A failed preview or install leaves no report to upload.
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The HTML report includes the trace of each failed test.
          path: playwright-report/
          retention-days: 14
