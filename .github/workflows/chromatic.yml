# .github/workflows/chromatic.yml

# Workflow name
name: 'Chromatic'

# Event for the workflow
on:
  push:
    branches:
      - develop
      - feature/project-onboarding
# List of jobs
jobs:
  chromatic-deployment:
    # Operating System
    runs-on: ubuntu-latest
    # Job steps
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 👈 Required to retrieve git history

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

        # 👇 Adds Chromatic as a step in the workflow
      - name: Publish to Chromatic
        uses: chromaui/action@v18
        # Chromatic GitHub Action options
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 👇 Chromatic projectToken, refer to the manage page to obtain it.
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Reuse the build from the previous step instead of building Storybook again.
          storybookBuildDir: storybook-static
          # Snapshot differences are reported in Chromatic, not treated as a build failure, matching the chromatic script in package.json.
          # Remove this if we start maintaining baselines, so visual changes nobody has reviewed fail the job. Note the workflow only runs on pushes to develop, so it would also need a pull_request trigger to gate anything before merge.
          exitZeroOnChanges: true
